[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counter-uas-v3-2"
version = "0.2.1"
description = "Counter-UAS tracking evaluation and tracker adapters"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.4,<9"]
verification = ["opencv-python>=4.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

