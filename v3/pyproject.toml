[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-detection-v3"
version = "0.1.0"
description = "Model-agnostic RGB and thermal drone detection benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.3"]
edge = ["openvino>=2025.0,<2027"]
dev = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
drone-detect = "drone_detection.cli:main"
drone-evalset = "drone_detection.evalset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

